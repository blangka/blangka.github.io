name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:   # GitHub 웹의 Actions 탭에서 "Run workflow" 버튼으로 수동 실행

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 이전 배포는 취소하지 않고 순서대로 하나씩 진행
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 배포마다 CSS/JS 주소 뒤에 ?v=<커밋 해시>를 붙여 브라우저 캐시를 무효화
      # (배포용 복사본에만 적용되고 저장소 파일은 바뀌지 않음)
      - name: Cache-bust CSS/JS
        run: |
          find . -name '*.html' -not -path './.git/*' -exec \
            perl -pi -e 's{((?:src|href)="(?!https?:|//)[^"?]+\.(?:js|css))"}{$1?v=$ENV{GITHUB_SHA}"}g' {} +

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
