<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>동화책 목록</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="book.css">
</head>
<body>
  <header class="list-header">
    <a href="../">&larr; 게임으로</a>
    <h1>동화책</h1>
    <p>읽고 싶은 책을 눌러 보세요.</p>
  </header>

  <main class="shelf" id="shelf"></main>

  <!-- 새 책을 만들면 아래에 script를 한 줄 더 추가하세요. -->
  <script src="photos.js"></script>
  <script src="school-person/book.js"></script>
  <script>
    var shelf = document.getElementById("shelf");
    Object.keys(window.BOOKS || {}).forEach(function (slug) {
      var b = window.BOOKS[slug];
      var a = document.createElement("a");
      a.className = "book-card";
      a.href = slug + "/";
      a.innerHTML =
        '<div class="cover-box">' + b.cover +
        '<div class="cover-title"><h1>' + b.title + '</h1><p>' + b.sub + '</p></div></div>' +
        "<h2>" + b.title + "</h2><p>" + b.summary + "</p>";
      var ph = document.createElement("img");
      ph.className = "photo";
      ph.alt = "";
      a.querySelector(".cover-box").insertBefore(ph, a.querySelector(".cover-title"));
      window.attachPhoto(ph, "img/cover", slug + "/");
      shelf.appendChild(a);
    });
  </script>
</body>
</html>
